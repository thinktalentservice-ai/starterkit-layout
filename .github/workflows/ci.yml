# Build gate. Runs on PRs, on every push to main, and is reused (workflow_call)
# by release.yml so publish jobs can only start after this passes.
#
# Pushes to a PR branch are covered by the pull_request trigger, so `push` is
# limited to main to avoid building every commit twice.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

# Stale PR runs get cancelled by a newer push. Never cancel main/release runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json "packageManager"
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # typecheck + typecheck:brand + vitest + build (tsc --noEmit && tsup)
      - name: Verify
        run: pnpm verify

      - name: Check dist output exists
        run: test -s dist/index.js && test -s dist/index.cjs && test -s dist/index.d.ts
