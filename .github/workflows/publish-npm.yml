# Publish to npm when a GitHub Release is published. Build must pass first.
# Token lives in the `npm` Environment secret NPM_TOKEN, never in the repo.
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: build # skipped if build fails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm # secret NPM_TOKEN + optional approval gate
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Release tag must match package.json version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' != package.json version '$PKG'"
            exit 1
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish (skip if version already on npm)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "::warning::$NAME@$VER already on npm, skipping"
            exit 0
          fi
          # Pre-release (1.6.0-beta.1) -> `next` dist-tag, never `latest`.
          if [[ "$VER" == *-* ]]; then TAG_ARG="--tag next"; else TAG_ARG=""; fi
          pnpm publish --no-git-checks --access public $TAG_ARG
